<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard | μLearn</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>🌦️ Weather Dashboard</h1>
      <p>Live Weather & 5-Day Forecast</p>
    </header>

    <form id="searchForm" class="search-box">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter city name (e.g. Kochi)"
        aria-label="City name"
        required
      >
      <button type="submit" id="searchButton">Search</button>
    </form>

    <p id="loading" class="message" role="status" hidden>
      Loading weather data...
    </p>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="currentCard" class="card current" hidden>
      <h2 id="cityName"></h2>
      <p id="todayDate"></p>
      <div id="weatherIcon" class="weather-icon">🌤️</div>
      <div id="temperature" class="temperature">--°C</div>
      <h3 id="condition"></h3>

      <div class="details">
        <div class="detail">
          <span>💧 Humidity</span>
          <strong id="humidity">--%</strong>
        </div>
        <div class="detail">
          <span>💨 Wind Speed</span>
          <strong id="wind">-- km/h</strong>
        </div>
        <div class="detail">
          <span>🌡️ Feels Like</span>
          <strong id="feelsLike">--°C</strong>
        </div>
      </div>
    </section>

    <section id="forecastCard" class="card" hidden>
      <h2>📅 5-Day Forecast</h2>
      <div id="forecast" class="forecast"></div>
    </section>

    <footer>
      <p>MuLearn ID: theerthavijayakumar@mulearn</p>
    </footer>
  </main>
</body>
</html>
